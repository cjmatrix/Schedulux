name: Deploy Frontend (S3 + CloudFront)

on:
  push:
    branches: [main, master]
    paths:
      - "apps/frontend-react/**"
      - "packages/widget/**"
      - "packages/proto/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy React + Widget to S3/CloudFront
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      S3_BUCKET: ${{ secrets.FRONTEND_S3_BUCKET || 'schedulux-dev-frontend-197977933137' }}
      CF_DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID || 'E2B10WSLVR7LRM' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install protoc (Protocol Buffers compiler)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build @repo/proto, @repo/widget & @repo/frontend-react
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.schedulux.xyz' }}
          VITE_CUSTOMER_GATEWAY_URL: ${{ secrets.VITE_CUSTOMER_GATEWAY_URL || 'https://client-api.schedulux.xyz' }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::warning::VITE_GOOGLE_CLIENT_ID secret is not set; Google Sign-In will be disabled."
          fi
          pnpm exec turbo build --filter=@repo/frontend-react

      - name: Verify widget.js & index.html exist in dist
        run: |
          test -f apps/frontend-react/dist/index.html
          test -f apps/frontend-react/dist/widget.js
          ls -lh apps/frontend-react/dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Upload hashed assets FIRST without --delete so open browser tabs don't hit 404s during rollout
      - name: Upload hashed JS/CSS chunks to S3 (1-year immutable cache)
        run: |
          aws s3 sync apps/frontend-react/dist/assets "s3://${S3_BUCKET}/assets" \
            --cache-control "public, max-age=31536000, immutable"

      # Upload unhashed embeddable widget.js with short 5-minute TTL
      - name: Upload widget.js to S3 (5-minute cache)
        run: |
          aws s3 cp apps/frontend-react/dist/widget.js "s3://${S3_BUCKET}/widget.js" \
            --cache-control "public, max-age=300" \
            --content-type "application/javascript"

      # Upload index.html & root static files LAST with no-cache
      - name: Upload index.html & root assets to S3 (no-cache)
        run: |
          aws s3 sync apps/frontend-react/dist "s3://${S3_BUCKET}" \
            --exclude "assets/*" \
            --exclude "widget.js" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront edge cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DIST_ID}" \
            --paths "/index.html" "/widget.js"
