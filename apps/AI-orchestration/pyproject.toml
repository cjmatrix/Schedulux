[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Agent orchetsrator"
readme = "README.md"
authors = [
    { name = "cjmatrix", email = "cjmartingarrix@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "bullmq>=3.3.0",
    "langchain>=0.1.13",
    "langchain-core>=0.1.33",
    "langchain-openai>=0.1.1",
    "pydantic>=2.6.4",
    "python-dotenv>=1.0.1",
    "langchain-google-genai>=4.4.0",
    "mongoengine>=0.29.0",
    "langgraph>=0.2.0",
]

[project.scripts]
agent-orchestrator = "agent_orchestrator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_orchestrator"]
