[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Agent orchetsrator"
readme = "README.md"
authors = [
    { name = "cjmatrix", email = "cjmartingarrix@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "bullmq>=3.3.0",
    "langchain>=0.1.13",
    "langchain-core>=0.1.33",
    "langchain-openai>=0.1.1",
    "pydantic>=2.6.4",
    "python-dotenv>=1.0.1",
    "langchain-google-genai>=4.4.0",
    "langgraph>=0.2.0",
    "beanie>=2.2.0",
    "motor>=3.7.1",
    "aiokafka>=0.11.0",
    "toonify>=1.6.0",
    "voyageai>=0.5.0",
    "langchain-groq>=1.1.3",
    "aio-pika>=10.1.1",
    "qdrant-client>=1.19.1",
]

[project.scripts]
agent-orchestrator = "agent_orchestrator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_orchestrator"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # function calls in argument defaults (fastapi/pydantic Depends/Field)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
exclude = [
    ".*_pb2\\.py$",
    ".*_pb2_grpc\\.py$",
]

[[tool.mypy.overrides]]
module = [
    "agent_orchestrator.proto.scheduling_pb2",
    "agent_orchestrator.proto.scheduling_pb2_grpc",
    "agent_orchestrator.proto.knowledge_pb2",
    "agent_orchestrator.proto.knowledge_pb2_grpc",
    "agent_orchestrator.scheduling_pb2",
    "agent_orchestrator.scheduling_pb2_grpc",
    "agent_orchestrator.knowledge_pb2",
    "agent_orchestrator.knowledge_pb2_grpc",
]
ignore_errors = true
