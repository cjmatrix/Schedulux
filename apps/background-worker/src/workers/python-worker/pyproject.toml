[project]
name = "python-worker"
version = "0.1.0"
description = "Background Python workers (crawler & schema generator)"
readme = "README.md"
authors = [
    { name = "cjmatrix", email = "cjmartingarrix@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bullmq>=3.3.0",
    "crawl4ai>=0.9.4",
    "pydantic>=2.13.5",
    "langchain>=0.1.13",
    "langchain-core>=0.1.33",
    "langchain-openai>=0.1.1",
    "python-dotenv>=1.0.1",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "aio-pika>=10.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_worker"]


