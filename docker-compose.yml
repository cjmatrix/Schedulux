services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: schedulux-rabbitmq
    ports:
      - "5672:5672"     
      - "15672:15672"   
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenTelemetry Sampler Collector: Receives OTLP gRPC/HTTP, tail-samples, buffers, and exports to Kafka
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: schedulux-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC (from NestJS services)
      - "4318:4318" # OTLP HTTP
    env_file:
      - .env
    restart: unless-stopped

  # OpenTelemetry Telemetry Ingestor: Consumes from Kafka, batches, and bulk-indexes into Bonsai OpenSearch
  otel-ingestor:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: schedulux-otel-ingestor
    command: ["--config=/etc/otel-ingestor-config.yaml"]
    volumes:
      - ./infra/observability/otel-ingestor-config.yaml:/etc/otel-ingestor-config.yaml
    env_file:
      - .env
    restart: unless-stopped

volumes:
  rabbitmq_data:
