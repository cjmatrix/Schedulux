extensions:
  basicauth/grafana:
    client_auth:
      username: "${env:GRAFANA_CLOUD_INSTANCE_ID}"
      password: "${env:GRAFANA_CLOUD_API_KEY}"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Memory limiter to ensure buffering telemetry never crashes container
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  tail_sampling:
    # Wait 15 seconds after the first span arrives so long LLM streaming spans and tool calls complete
    decision_wait: 15s
    # Max concurrent traces buffered in RAM
    num_traces: 20000
    expected_new_traces_per_sec: 50

    policies:
      # Rule 1 (Errors): Keep 100% if ANY span in the trace has status ERROR (5xx or unhandled exception)
      - name: keep-all-errors
        type: status_code
        status_code:
          status_codes: [ERROR]

      # Rule 2 (Slow LLM / Agent Endpoints): Keep 100% if duration exceeds 10000ms (10 seconds)
      - name: keep-slow-llm-traces
        type: and
        and:
          and_sub_policy:
            - name: is-llm-endpoint
              type: string_attribute
              string_attribute:
                key: http.route
                values:
                  - /api/v1/public/chat
                  - api/v1/public/chat
                  - /api/v1/tenant/knowledge/onboarding/start
                  - api/v1/tenant/knowledge/onboarding/start
                  - /api/v1/tenant/knowledge/onboarding/message
                  - api/v1/tenant/knowledge/onboarding/message
                  - /api/v1/tenant/knowledge/onboarding/sandbox
                  - api/v1/tenant/knowledge/onboarding/sandbox
            - name: llm-latency-threshold
              type: latency
              latency:
                threshold_ms: 10000

      # Rule 3 (Slow Standard CRUD Endpoints): Keep 100% if duration exceeds 1000ms (1 second)
      - name: keep-slow-crud-traces
        type: and
        and:
          and_sub_policy:
            - name: not-llm-endpoint
              type: string_attribute
              string_attribute:
                key: http.route
                values:
                  - /api/v1/public/chat
                  - api/v1/public/chat
                  - /api/v1/tenant/knowledge/onboarding/start
                  - api/v1/tenant/knowledge/onboarding/start
                  - /api/v1/tenant/knowledge/onboarding/message
                  - api/v1/tenant/knowledge/onboarding/message
                  - /api/v1/tenant/knowledge/onboarding/sandbox
                  - api/v1/tenant/knowledge/onboarding/sandbox
                invert_match: true
            - name: crud-latency-threshold
              type: latency
              latency:
                threshold_ms: 1000

      # Rule 4 (Normal Traffic): Keep only 5% of everything else
      - name: sample-normal-traffic
        type: probabilistic
        probabilistic:
          sampling_percentage: 5

  # Batch surviving telemetry before pushing upstream
  batch:
    timeout: 2s
    send_batch_size: 512

exporters:
  kafka:
    brokers: ["${env:KAFKA_BROKERS}"]
    protocol_version: "2.1.0"
    traces:
      topic: "otel-traces"
      encoding: "otlp_json"
    logs:
      topic: "otel-logs"
      encoding: "otlp_json"
    auth:
      sasl:
        mechanism: "SCRAM-SHA-256"
        username: "${env:KAFKA_USERNAME}"
        password: "${env:KAFKA_PASSWORD}"
    tls:
      insecure: false
      insecure_skip_verify: true

  otlphttp/grafana:
    endpoint: "${env:GRAFANA_CLOUD_OTLP_ENDPOINT}"
    auth:
      authenticator: basicauth/grafana

service:
  extensions: [basicauth/grafana]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [kafka]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/grafana]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [kafka]
