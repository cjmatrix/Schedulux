apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-orchestration
  namespace: schedulux
  labels:
    app: ai-orchestration
    app.kubernetes.io/name: ai-orchestration
    app.kubernetes.io/part-of: schedulux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-orchestration
  template:
    metadata:
      labels:
        app: ai-orchestration
    spec:
      containers:
        - name: ai-orchestration
          image: cjmatrix/ai-orchestration:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50052
              name: grpc
          envFrom:
            - secretRef:
                name: ai-orchestration-secrets
          env:
            - name: PORT
              value: "50052"
            - name: OTEL_SERVICE_NAME
              value: "ai-orchestration"
          resources:
            requests:
              cpu: 100m
              memory: 250Mi
            limits:
              cpu: 400m
              memory: 450Mi
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 15
            periodSeconds: 20
---
# Standard ClusterIP Service
apiVersion: v1
kind: Service
metadata:
  name: ai-orchestration-svc
  namespace: schedulux
  labels:
    app: ai-orchestration
spec:
  type: ClusterIP
  selector:
    app: ai-orchestration
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
---
# Headless Service for Client-Side gRPC Round-Robin Load Balancing
apiVersion: v1
kind: Service
metadata:
  name: ai-orchestration-headless
  namespace: schedulux
  labels:
    app: ai-orchestration
spec:
  clusterIP: None
  selector:
    app: ai-orchestration
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-orchestration-hpa
  namespace: schedulux
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-orchestration
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
