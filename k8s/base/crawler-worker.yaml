apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler-worker
  namespace: schedulux
  labels:
    app: crawler-worker
    app.kubernetes.io/name: crawler-worker
    app.kubernetes.io/part-of: schedulux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crawler-worker
  template:
    metadata:
      labels:
        app: crawler-worker
    spec:
      containers:
        - name: crawler-worker
          image: cjmatrix/crawler-worker:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: crawler-worker-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: "crawler-worker"
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 900Mi
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
# Auto-scale worker on AWS SQS Queue Backlog
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: crawler-worker-aws-auth
  namespace: schedulux
spec:
  secretTargetRef:
    - parameter: awsAccessKeyID
      name: crawler-worker-secrets
      key: AWS_ACCESS_KEY_ID
    - parameter: awsSecretAccessKey
      name: crawler-worker-secrets
      key: AWS_SECRET_ACCESS_KEY
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: crawler-worker-scaler
  namespace: schedulux
spec:
  scaleTargetRef:
    name: crawler-worker
  minReplicaCount: 1
  maxReplicaCount: 2
  cooldownPeriod: 300
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: crawler-worker-aws-auth
      metadata:
        queueURL: https://sqs.ap-south-1.amazonaws.com/197977933137/schedulux-knowledge-document-indexing-queue-dev
        queueLength: "2"
        awsRegion: ap-south-1
    - type: aws-sqs-queue
      authenticationRef:
        name: crawler-worker-aws-auth
      metadata:
        queueURL: https://sqs.ap-south-1.amazonaws.com/197977933137/schedulux-knowledge-crawl-queue-dev
        queueLength: "2"
        awsRegion: ap-south-1
