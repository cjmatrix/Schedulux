apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-api-gateway
  namespace: schedulux
  labels:
    app: customer-api-gateway
    app.kubernetes.io/name: customer-api-gateway
    app.kubernetes.io/part-of: schedulux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-api-gateway
  template:
    metadata:
      labels:
        app: customer-api-gateway
    spec:
      containers:
        - name: customer-api-gateway
          image: cjmatrix/customer-api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
              name: http
          envFrom:
            - secretRef:
                name: customer-api-gateway-secrets
          env:
            - name: PORT
              value: "5001"
            - name: OTEL_SERVICE_NAME
              value: "customer-api-gateway"
          resources:
            requests:
              cpu: 50m
              memory: 150Mi
            limits:
              cpu: 250m
              memory: 250Mi
          readinessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: customer-api-gateway-svc
  namespace: schedulux
  labels:
    app: customer-api-gateway
spec:
  type: ClusterIP
  selector:
    app: customer-api-gateway
  ports:
    - name: http
      port: 5001
      targetPort: 5001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customer-api-gateway-hpa
  namespace: schedulux
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customer-api-gateway
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
