apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: schedulux-ingress
  namespace: schedulux
  labels:
    app.kubernetes.io/part-of: schedulux
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  rules:
    - host: api.schedulux.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway-svc
                port:
                  number: 5000
    - host: client-api.schedulux.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-api-gateway-svc
                port:
                  number: 5001
