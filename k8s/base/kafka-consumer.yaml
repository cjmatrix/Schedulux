apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer
  namespace: schedulux
  labels:
    app: kafka-consumer
    app.kubernetes.io/name: kafka-consumer
    app.kubernetes.io/part-of: schedulux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-consumer
  template:
    metadata:
      labels:
        app: kafka-consumer
    spec:
      containers:
        - name: kafka-consumer
          image: cjmatrix/kafka-consumer:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: kafka-consumer-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: "kafka-consumer"
          resources:
            requests:
              cpu: 50m
              memory: 120Mi
            limits:
              cpu: 200m
              memory: 220Mi
---
# KEDA ScaledObject: Auto-scale worker on Kafka Consumer Lag
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kafka-consumer-scaler
  namespace: schedulux
spec:
  scaleTargetRef:
    name: kafka-consumer
  minReplicaCount: 1
  maxReplicaCount: 2
  cooldownPeriod: 300
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-service.schedulux.svc.cluster.local:9092
        consumerGroup: kafka-consumer-booking-events
        topic: booking.events
        lagThreshold: "10"
