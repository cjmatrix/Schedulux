apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer
  namespace: schedulux
  labels:
    app: kafka-consumer
    app.kubernetes.io/name: kafka-consumer
    app.kubernetes.io/part-of: schedulux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-consumer
  template:
    metadata:
      labels:
        app: kafka-consumer
    spec:
      containers:
        - name: kafka-consumer
          image: cjmatrix/kafka-consumer:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: kafka-consumer-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: "kafka-consumer"
          resources:
            requests:
              cpu: 50m
              memory: 120Mi
            limits:
              cpu: 200m
              memory: 220Mi
---
# KEDA TriggerAuthentication & ScaledObject: Auto-scale worker on Aiven Kafka Consumer Lag
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: kafka-consumer-auth
  namespace: schedulux
spec:
  secretTargetRef:
    - parameter: username
      name: kafka-consumer-secrets
      key: KAFKA_USERNAME
    - parameter: password
      name: kafka-consumer-secrets
      key: KAFKA_PASSWORD
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kafka-consumer-scaler
  namespace: schedulux
spec:
  scaleTargetRef:
    name: kafka-consumer
  minReplicaCount: 1
  maxReplicaCount: 2
  cooldownPeriod: 300
  triggers:
    - type: kafka
      authenticationRef:
        name: kafka-consumer-auth
      metadata:
        bootstrapServers: kafka-schedulux-schdulux.d.aivencloud.com:10858
        consumerGroup: kafka-consumer-booking-events
        topic: scheduling.booking.events
        lagThreshold: "10"
        sasl: scram_sha256
        tls: enable
        unsafeSsl: "true"
    - type: kafka
      authenticationRef:
        name: kafka-consumer-auth
      metadata:
        bootstrapServers: kafka-schedulux-schdulux.d.aivencloud.com:10858
        consumerGroup: kafka-consumer-token-ledger
        topic: billing.tokens.consumed
        lagThreshold: "20"
        sasl: scram_sha256
        tls: enable
        unsafeSsl: "true"
