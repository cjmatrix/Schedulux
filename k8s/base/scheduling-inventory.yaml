apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduling-inventory
  namespace: schedulux
  labels:
    app: scheduling-inventory
    app.kubernetes.io/name: scheduling-inventory
    app.kubernetes.io/part-of: schedulux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduling-inventory
  template:
    metadata:
      labels:
        app: scheduling-inventory
    spec:
      containers:
        - name: scheduling-inventory
          image: cjmatrix/scheduling-inventory:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50053
              name: grpc
          envFrom:
            - secretRef:
                name: scheduling-inventory-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: "scheduling-inventory"
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 350m
              memory: 350Mi
          readinessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 15
            periodSeconds: 20
---
# Standard ClusterIP Service
apiVersion: v1
kind: Service
metadata:
  name: scheduling-inventory-svc
  namespace: schedulux
  labels:
    app: scheduling-inventory
spec:
  type: ClusterIP
  selector:
    app: scheduling-inventory
  ports:
    - name: grpc
      port: 50053
      targetPort: 50053
---
# Headless Service for Client-Side gRPC Round-Robin Load Balancing
apiVersion: v1
kind: Service
metadata:
  name: scheduling-inventory-headless
  namespace: schedulux
  labels:
    app: scheduling-inventory
spec:
  clusterIP: None
  selector:
    app: scheduling-inventory
  ports:
    - name: grpc
      port: 50053
      targetPort: 50053
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scheduling-inventory-hpa
  namespace: schedulux
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scheduling-inventory
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
