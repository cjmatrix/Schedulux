syntax = "proto3";

package dashboard;

service DashboardAuthService {
  rpc Login (DashboardUserLoginRequest) returns (DashboardUserLoginResponse);
}

service DashboardUserService {
  rpc InviteUser (InviteUserRequest) returns (InviteUserResponse);
  rpc ListWorkspaceUsers (ListWorkspaceUsersRequest) returns (ListWorkspaceUsersResponse);
}

message DashboardUserLoginRequest {
  string email = 1;
  string password = 2;
}

message DashboardUserLoginResponse {
  string message = 1;
  WorkspaceUserInfo user = 2;
  string access_token = 3;
  string refresh_token = 4;
}

message InviteUserRequest {
  string tenant_id = 1;
  string email = 2;
  string name = 3;
  string system_role = 4;
}

message InviteUserResponse {
  string message = 1;
  string user_id = 2;
  string email = 3;
  string name = 4;
  string system_role = 5;
}

message WorkspaceUserInfo {
  string user_id = 1;
  string tenant_id = 2;
  string email = 3;
  string name = 4;
  string system_role = 5;
  string created_at = 6;
}

message ListWorkspaceUsersRequest {
  string tenant_id = 1;
  optional int32 page = 2;
  optional int32 limit = 3;
  optional string search = 4;
  optional string role = 5;
}

message ListWorkspaceUsersResponse {
  repeated WorkspaceUserInfo users = 1;
  int32 total_count = 2;
}
