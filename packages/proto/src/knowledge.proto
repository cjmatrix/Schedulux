syntax = "proto3";

package knowledge;

service KnowledgeService {
  rpc CrawlSite (CrawlSiteRequest) returns (CrawlSiteResponse);
  rpc GetCrawlStatus (GetCrawlStatusRequest) returns (GetCrawlStatusResponse);
  rpc StartOnboardingSession (StartOnboardingRequest) returns (OnboardingResponse);
  rpc ResumeOnboardingSession (ResumeOnboardingRequest) returns (OnboardingResponse);
  rpc SaveInitialAgentDraft (SaveInitialAgentDraftRequest) returns (SaveInitialAgentDraftResponse);
  rpc ListTenantAgents (ListTenantAgentsRequest) returns (ListTenantAgentsResponse);
  rpc GetAgentMessages (GetAgentMessagesRequest) returns (GetAgentMessagesResponse);
  rpc CustomerChat (CustomerChatRequest) returns (CustomerChatResponse);
  rpc GetCustomerMessages (GetCustomerMessagesRequest) returns (GetCustomerMessagesResponse);
}

message CrawlSiteRequest {
  string tenant_id = 1;
  string url = 2;
}

message CrawlSiteResponse {
  string message = 1;
  string job_id = 2;
  string status = 3;
}

message GetCrawlStatusRequest {
  string tenant_id = 1;
  string job_id = 2;
}

message CrawlPageResult {
  string url = 1;
  string markdown = 2;
  bool success = 3;
  string error = 4;
}

message GetCrawlStatusResponse {
  string job_id = 1;
  string status = 2;
  int32 pages_crawled = 3;
  repeated CrawlPageResult pages = 4;
}

message StartOnboardingRequest {
  string tenant_id = 1;
  string initial_draft_json = 2;
  string agent_id = 3;
}

message ResumeOnboardingRequest {
  string tenant_id = 1;
  string user_answer = 2;
  string agent_id = 3;
}

message OnboardingResponse {
  string status = 1;
  string question = 2;
  string field = 3;
  string type = 4;
  string draft_schema_json = 5;
  string live_schema_json = 6;
}

message SaveInitialAgentDraftRequest {
  string tenant_id = 1;
  string draft_json = 2;
  string creation_source = 3;
  string name = 4;
}

message SaveInitialAgentDraftResponse {
  string message = 1;
  string agent_id = 2;
  string status = 3;
}

message ListTenantAgentsRequest {
  string tenant_id = 1;
}

message AgentSummaryInfo {
  string agent_id = 1;
  string name = 2;
  string status = 3; // "pending" or "created"
  string creation_source = 4;
  int32 services_count = 5;
  string updated_at = 6;
  string created_at = 7;
}

message ListTenantAgentsResponse {
  repeated AgentSummaryInfo agents = 1;
}

message ChatMessageInfo {
  string id = 1;
  string tenant_id = 2;
  string agent_id = 3;
  string role = 4; // "agent" or "tenant"
  string content = 5;
  string created_at = 6;
}

message GetAgentMessagesRequest {
  string tenant_id = 1;
  string agent_id = 2;
  int32 limit = 3;
  optional string before = 4;
}

message GetAgentMessagesResponse {
  repeated ChatMessageInfo messages = 1;
  optional string next_cursor = 2;
  bool has_more = 3;
}

message CustomerChatMessageInfo {
  string id = 1;
  string session_id = 2;
  string tenant_id = 3;
  string agent_id = 4;
  string role = 5;
  string content = 6;
  string created_at = 7;
}

message CustomerChatRequest {
  string tenant_id = 1;
  string agent_id = 2;
  string session_id = 3;
  string message = 4;
  optional string customer_id = 5;
  optional string customer_phone = 6;
  optional string customer_name = 7;
}

message CustomerChatResponse {
  string session_id = 1;
  string response = 2;
  repeated CustomerChatMessageInfo history = 3;
  optional string booking_id = 4;
  optional string booking_reference = 5;
  optional string status = 6;
}

message GetCustomerMessagesRequest {
  string tenant_id = 1;
  string agent_id = 2;
  string session_id = 3;
  optional int32 limit = 4;
}

message GetCustomerMessagesResponse {
  repeated CustomerChatMessageInfo messages = 1;
}

