syntax = "proto3";

package knowledge;

service KnowledgeService {
  rpc CrawlSite (CrawlSiteRequest) returns (CrawlSiteResponse);
  rpc GetCrawlStatus (GetCrawlStatusRequest) returns (GetCrawlStatusResponse);
  rpc StartOnboardingSession (StartOnboardingRequest) returns (OnboardingResponse);
  rpc ResumeOnboardingSession (ResumeOnboardingRequest) returns (OnboardingResponse);
  rpc SaveInitialAgentDraft (SaveInitialAgentDraftRequest) returns (SaveInitialAgentDraftResponse);
  rpc ListTenantAgents (ListTenantAgentsRequest) returns (ListTenantAgentsResponse);
}

message CrawlSiteRequest {
  string tenant_id = 1;
  string url = 2;
}

message CrawlSiteResponse {
  string message = 1;
  string job_id = 2;
  string status = 3;
}

message GetCrawlStatusRequest {
  string tenant_id = 1;
  string job_id = 2;
}

message CrawlPageResult {
  string url = 1;
  string markdown = 2;
  bool success = 3;
  string error = 4;
}

message GetCrawlStatusResponse {
  string job_id = 1;
  string status = 2;
  int32 pages_crawled = 3;
  repeated CrawlPageResult pages = 4;
}

message StartOnboardingRequest {
  string tenant_id = 1;
  string initial_draft_json = 2;
  string agent_id = 3;
}

message ResumeOnboardingRequest {
  string tenant_id = 1;
  string user_answer = 2;
  string agent_id = 3;
}

message OnboardingResponse {
  string status = 1;
  string question = 2;
  string field = 3;
  string type = 4;
  string draft_schema_json = 5;
}

message SaveInitialAgentDraftRequest {
  string tenant_id = 1;
  string draft_json = 2;
  string creation_source = 3;
  string name = 4;
}

message SaveInitialAgentDraftResponse {
  string message = 1;
  string agent_id = 2;
  string status = 3;
}

message ListTenantAgentsRequest {
  string tenant_id = 1;
}

message AgentSummaryInfo {
  string agent_id = 1;
  string name = 2;
  string status = 3; // "pending" or "created"
  string creation_source = 4;
  int32 services_count = 5;
  string updated_at = 6;
  string created_at = 7;
}

message ListTenantAgentsResponse {
  repeated AgentSummaryInfo agents = 1;
}
