syntax = "proto3";

package tenant;

service TenantAuthService {
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc GoogleLogin (TenantGoogleLoginRequest) returns (LoginResponse);
  rpc VerifyEmail (VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc Logout (LogoutRequest) returns (LogoutResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc GetProfile (TenantGetProfileRequest) returns (TenantGetProfileResponse);
  rpc ForgotPassword (ForgotPasswordRequest) returns (ForgotPasswordResponse);
  rpc ResetPassword (ResetPasswordRequest) returns (ResetPasswordResponse);
}

message TenantGoogleLoginRequest {
  string id_token = 1;
}

message TenantGetProfileRequest {
  string tenant_id = 1;
}

message TenantGetProfileResponse {
  TenantInfo tenant = 1;
}

service TenantService {
  rpc ListTenants (ListTenantsRequest) returns (ListTenantsResponse);
  rpc GetTenantById (GetTenantByIdRequest) returns (GetTenantByIdResponse);
  rpc SuspendTenant (SuspendTenantRequest) returns (SuspendTenantResponse);
  rpc UpdateTenantSubscription (UpdateTenantSubscriptionRequest) returns (UpdateTenantSubscriptionResponse);
  rpc GetTenantBillingInfo (GetTenantBillingInfoRequest) returns (GetTenantBillingInfoResponse);
  rpc ProcessPaddleWebhook (PaddleWebhookRequest) returns (PaddleWebhookResponse);
  rpc CreatePaddleCheckout (CreatePaddleCheckoutRequest) returns (CreatePaddleCheckoutResponse);
}

message GetTenantByIdRequest {
  string tenant_id = 1;
}

message GetTenantByIdResponse {
  TenantInfo tenant = 1;
}


message RegisterRequest {
  string business_name = 1;
  string full_name = 2;
  string email = 3;
  string password = 4;
}

message RegisterResponse {
  string tenant_id = 1;
  string message = 2;
  string verification_token = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message TenantInfo {
  string tenant_id = 1;
  string business_name = 2;
  string contact_email = 3;
  string tier = 4;
  string status = 5;
  optional string paddle_customer_id = 6;
  optional string paddle_subscription_id = 7;
  optional string subscription_status = 8;
}

message ListTenantsRequest {
  int32 page = 1;     
  int32 limit = 2;    
  optional string search = 3;
  optional string tier = 4;
  optional string status = 5;
  repeated string tenant_ids = 6;
}

message ListTenantsResponse {
  repeated TenantInfo tenants = 1;
  int32 total_count = 2; 
}

message SuspendTenantRequest {
  string tenant_id = 1;
}

message SuspendTenantResponse {
  string message = 1;
  TenantInfo tenant = 2;
}


message LoginResponse {
  string message = 1;
  TenantInfo tenant = 2;
  string access_token = 3;
  string refresh_token = 4;
}

message VerifyEmailRequest {
  string token = 1;
}

message VerifyEmailResponse {
  string message = 1;
  string tenant_id = 2;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  string message = 1;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string message = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ForgotPasswordResponse {
  string message = 1;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {
  string message = 1;
}

message UpdateTenantSubscriptionRequest {
  string tenant_id = 1;
  string tier = 2;
  optional string subscription_status = 3;
}

message UpdateTenantSubscriptionResponse {
  bool success = 1;
  string message = 2;
  TenantInfo tenant = 3;
}

message GetTenantBillingInfoRequest {
  string tenant_id = 1;
}

message GetTenantBillingInfoResponse {
  string tenant_id = 1;
  string tier = 2;
  string paddle_customer_id = 3;
  string paddle_subscription_id = 4;
  string subscription_status = 5;
}

message PaddleWebhookRequest {
  string event_id = 1;
  string event_type = 2;
  string occurred_at = 3;
  string data_json = 4;
}

message PaddleWebhookResponse {
  bool success = 1;
  string message = 2;
  string event_type = 3;
}

message CreatePaddleCheckoutRequest {
  string tenant_id = 1;
  string plan = 2;
}

message CreatePaddleCheckoutResponse {
  bool success = 1;
  string transaction_id = 2;
  string message = 3;
}


