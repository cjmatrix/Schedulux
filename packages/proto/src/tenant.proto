syntax = "proto3";

package tenant;

service TenantAuthService {
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc GoogleLogin (TenantGoogleLoginRequest) returns (LoginResponse);
  rpc VerifyEmail (VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc Logout (LogoutRequest) returns (LogoutResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc GetProfile (TenantGetProfileRequest) returns (TenantGetProfileResponse);
  rpc ForgotPassword (ForgotPasswordRequest) returns (ForgotPasswordResponse);
  rpc ResetPassword (ResetPasswordRequest) returns (ResetPasswordResponse);
}

message TenantGoogleLoginRequest {
  string id_token = 1;
}

message TenantGetProfileRequest {
  string tenant_id = 1;
}

message TenantGetProfileResponse {
  TenantInfo tenant = 1;
}

service TenantService {
  rpc ListTenants (ListTenantsRequest) returns (ListTenantsResponse);
  rpc SuspendTenant (SuspendTenantRequest) returns (SuspendTenantResponse);
}


message RegisterRequest {
  string business_name = 1;
  string full_name = 2;
  string email = 3;
  string password = 4;
}

message RegisterResponse {
  string tenant_id = 1;
  string message = 2;
  string verification_token = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message TenantInfo {
  string tenant_id = 1;
  string business_name = 2;
  string contact_email = 3;
  string tier = 4;
  string status = 5;
}

message ListTenantsRequest {
  int32 page = 1;     
  int32 limit = 2;    
  optional string search = 3;
  optional string tier = 4;
  optional string status = 5;
}

message ListTenantsResponse {
  repeated TenantInfo tenants = 1;
  int32 total_count = 2; 
}

message SuspendTenantRequest {
  string tenant_id = 1;
}

message SuspendTenantResponse {
  string message = 1;
  TenantInfo tenant = 2;
}


message LoginResponse {
  string message = 1;
  TenantInfo tenant = 2;
  string access_token = 3;
  string refresh_token = 4;
}

message VerifyEmailRequest {
  string token = 1;
}

message VerifyEmailResponse {
  string message = 1;
  string tenant_id = 2;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  string message = 1;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string message = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ForgotPasswordResponse {
  string message = 1;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {
  string message = 1;
}
